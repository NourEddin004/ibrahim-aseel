<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قائمة المدعوين — إبراهيم & أسيل</title>
<!-- this page is for the couple, not for guests: keep it out of search -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  --cream:#E6DAC1; --cream-lt:#EFE6D3; --burg:#612618; --pom:#9B2E20;
  --gold:#A88755; --ink:#34281D; --ink-soft:#55442F; --sage:#626455;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{ box-sizing:border-box }
[hidden]{ display:none !important }
body{
  margin:0; padding:1.5rem 1rem;
  font-family:'Amiri',serif; font-size:1rem; line-height:1.9;
  color:var(--ink); background:var(--cream);
}
/* ── one layout, every screen ─────────────────────────────────────
   Nothing here is allowed to depend on how wide the phone is. The tally
   used to be repeat(auto-fit, minmax(...)), which is a grid that decides
   its own column count — so it came out three-and-one on one handset and
   two-by-two on another, and the two did not look like the same page.
   Every vw unit went with it for the same reason: a vw is a fraction of
   the viewport, so it is a difference between devices by definition.
   Fixed column counts, fixed sizes, one column of fixed width.
   ═══════════════════════════════════════════════════════════════════ */
/* 22rem = 352px. Any phone with at least 384px of screen lands exactly
   on that number, so a 13 and a 15 Pro Max render the same pixels rather
   than merely the same arrangement. Narrower handsets than that get the
   space they have — the alternative is a page that runs off the side,
   which is worse than eight pixels of difference. */
.wrap{ width:100%; max-width:22rem; margin-inline:auto }

h1{
  margin:0 0 .2rem; text-align:center; font-family:'Aref Ruqaa',serif;
  font-weight:400; font-size:1.6rem; color:var(--burg);
}
.sub{ margin:0 0 1.4rem; text-align:center;
  font-size:.98rem; color:var(--ink-soft) }

.card{
  background:var(--cream-lt); border-radius:2px;
  box-shadow:0 0 0 1px rgba(97,38,24,.35), 0 0 0 4px var(--cream),
             0 0 0 5px rgba(168,135,85,.45), 0 10px 30px -22px rgba(45,33,25,.6);
  padding:1.1rem;
}

/* ── the state line ──────────────────────────────────────────────── */
.gate{ max-width:26rem; margin-inline:auto; text-align:center }
.msg{ margin:0; color:var(--ink-soft) }
.msg.bad{ color:var(--pom) }
button{
  font:inherit; cursor:pointer; border:0; border-radius:2px;
  background:var(--burg); color:var(--cream-lt);
  min-height:40px; padding:.35rem 1rem;
  transition:background .3s var(--ease);
}
button:hover{ background:#71301E }
button:focus-visible{ outline:2px solid var(--gold); outline-offset:3px }
button[disabled]{ opacity:.6; cursor:default }
.err{ margin:.9rem 0 0; color:var(--pom); font-size:.95rem; min-height:1.4em }

/* ── the tallies ─────────────────────────────────────────────────── */
.tally{
  display:grid; grid-template-columns:repeat(2,1fr);
  gap:.7rem; margin:0 0 1.2rem;
}
.tally div{
  background:var(--cream-lt); border-radius:2px; padding:.8rem .6rem;
  text-align:center; box-shadow:0 0 0 1px rgba(168,135,85,.45);
}
.tally b{ display:block; font-family:'Aref Ruqaa',serif; font-weight:400;
  font-size:1.7rem; line-height:1.3; color:var(--burg) }
.tally i{ font-style:normal; font-size:.88rem; color:var(--ink-soft) }

/* ── the list ────────────────────────────────────────────────────── */
.bar{ display:flex; flex-wrap:wrap; gap:.6rem; align-items:center;
  margin:0 0 .9rem }
.bar button{ width:auto; margin:0; min-height:40px; padding:.35rem 1rem;
  font-size:.94rem }
.bar .ghost{ background:none; color:var(--burg);
  box-shadow:inset 0 0 0 1px rgba(97,38,24,.4) }
.bar .ghost:hover{ background:rgba(97,38,24,.07) }
.spacer{ flex:1 }

/* ── one guest, one card ──────────────────────────────────────────
   This was a six-column table. On a 352px column that table wanted
   433px, so it scrolled sideways inside its own box — and the delete
   button, being the last column, sat off the edge where nobody would
   find it. A row of a table is the wrong shape for a phone. A card
   holds the same five facts, needs no horizontal scrolling, and puts
   the button where the thumb already is.
   ═══════════════════════════════════════════════════════════════════ */
.g{
  display:grid; grid-template-columns:1fr auto; gap:.2rem .5rem;
  align-items:start;
  padding:.75rem 0; border-bottom:1px solid rgba(168,135,85,.4);
}
.g:last-child{ border-bottom:0 }
.g-name{ font-weight:700; color:var(--burg); line-height:1.5 }
.g-act{ grid-row:1 / span 3; align-self:center }
.g-meta{ grid-column:1; font-size:.92rem; color:var(--ink-soft); line-height:1.6 }
.g-meta .yes{ color:var(--burg) }
.g-meta .g-meta .dot{ opacity:.5; margin-inline:.3rem }
.g-note{ grid-column:1; font-size:.92rem; color:var(--ink-soft); line-height:1.6 }
.g-when{ grid-column:1; font-size:.82rem; color:var(--ink-soft); opacity:.75 }

.empty{ padding:2rem 0; text-align:center; color:var(--ink-soft) }

/* ── remove one ──────────────────────────────────────────────────── */
/* Two taps, never one. A single × beside a name is a row deleted by a
   thumb brushing the screen, and there is no undo behind it. */
.x{
  border:0; background:none; cursor:pointer; padding:.3rem .45rem;
  color:var(--sage); font-size:1.05rem; line-height:1; border-radius:2px;
}
.x:hover{ color:var(--pom); background:rgba(155,46,32,.08) }
.confirm{ display:flex; gap:.3rem; align-items:center }
.confirm b{ font-weight:400; font-size:.86rem; color:var(--pom) }
.confirm button{ min-height:0; padding:.22rem .5rem; font-size:.86rem }
.confirm .yes{ background:var(--pom) }
.confirm .no{ background:none; color:var(--ink-soft);
  box-shadow:inset 0 0 0 1px rgba(97,38,24,.3) }

/* ── add one ─────────────────────────────────────────────────────── */
.addwrap{ margin:0 0 1.2rem }
.addwrap > button{ width:100% }
.addform{ margin-top:.8rem }
.addform label{ display:block; margin-top:.7rem; font-size:.9rem; color:var(--ink-soft) }
.addform input, .addform select{
  width:100%; min-height:44px; margin-top:.25rem; padding:.45rem .7rem;
  font:inherit; font-size:1rem; color:var(--ink);
  background:#FFFCF3; border:1px solid rgba(107,93,61,.45); border-radius:2px;
}
.addform input:focus-visible, .addform select:focus-visible{
  outline:2px solid var(--gold); outline-offset:2px }
.addrow{ display:grid; grid-template-columns:1fr 1fr; gap:.6rem }
.lbl{ display:block; margin-top:.7rem; font-size:.9rem; color:var(--ink-soft) }
.step{
  display:grid; grid-template-columns:44px 1fr 44px; align-items:stretch;
  margin-top:.25rem; height:44px;
  background:#FFFCF3; border:1px solid rgba(107,93,61,.45); border-radius:2px;
}
.step button{
  min-height:0; padding:0; border-radius:0; font-size:1.25rem; line-height:1;
  background:none; color:var(--burg);
}
.step button:hover{ background:rgba(97,38,24,.08) }
.step button[disabled]{ opacity:.35 }
.step output{
  display:grid; place-items:center; font-size:1.05rem; color:var(--ink);
  border-inline:1px solid rgba(107,93,61,.3);
}
.step.off{ opacity:.45; pointer-events:none }
.addbtns{ display:flex; gap:.5rem; margin-top:1rem }
.addbtns button{ flex:1 }
.addbtns .cancel{ background:none; color:var(--burg);
  box-shadow:inset 0 0 0 1px rgba(97,38,24,.4) }
</style>
</head>

<body>
<div class="wrap">

  <h1>قائمة المدعوين</h1>
  <p class="sub">الردود على دعوة زفاف إبراهيم وأسيل</p>

  <!-- No form. The link is the credential: /list/#s=<secret>. -->
  <section class="card gate" id="gate">
    <p class="msg" id="msg">جارٍ فتح القائمة…</p>
  </section>

  <!-- ── the list ─────────────────────────────────────────────────── -->
  <section id="list" hidden>
    <div class="tally">
      <div><b id="tYes">٠</b><i>مؤكِّد</i></div>
      <div><b id="tHeads">٠</b><i>إجمالي الأشخاص</i></div>
      <div><b id="tNo">٠</b><i>اعتذار</i></div>
      <div><b id="tAll">٠</b><i>مجموع الردود</i></div>
    </div>

    <!-- for the relative who replies by phone instead of through the card -->
    <div class="addwrap">
      <button type="button" id="addOpen">إضافة ضيف</button>

      <div class="card addform" id="addForm" hidden>
        <label for="aName">الاسم الكامل</label>
        <input id="aName" type="text" maxlength="80" autocomplete="off">

        <div class="addrow">
          <div>
            <label for="aGo">الحضور</label>
            <select id="aGo">
              <option value="yes">نعم</option>
              <option value="no">اعتذار</option>
            </select>
          </div>
          <div>
            <!-- A stepper, not a number field. type="number" accepts ASCII
                 digits only, so an Arabic keyboard types ٣ and the browser
                 throws the keystroke away — the field looks broken and is
                 doing exactly what it was told. Two buttons need no
                 keyboard at all, which is also how the invitation itself
                 asks the same question. -->
            <span class="lbl" id="aNumLbl">عدد الأشخاص</span>
            <div class="step" role="group" aria-labelledby="aNumLbl">
              <button type="button" id="aMinus" aria-label="عدد أقل">−</button>
              <output id="aOut" aria-live="polite">١</output>
              <button type="button" id="aPlus" aria-label="عدد أكثر">+</button>
            </div>
          </div>
        </div>

        <label for="aNote">ملاحظات (اختياري)</label>
        <input id="aNote" type="text" maxlength="200" autocomplete="off">

        <div class="addbtns">
          <button type="button" id="aSave">حفظ</button>
          <button type="button" class="cancel" id="aCancel">إلغاء</button>
        </div>
        <p class="err" id="aErr" role="alert"></p>
      </div>
    </div>

    <div class="card">
      <div class="bar">
        <button type="button" id="refresh">تحديث</button>
        <button type="button" class="ghost" id="csv">تنزيل CSV</button>
        <span class="spacer"></span>
      </div>

      <div id="rows"></div>

      <p class="empty" id="empty" hidden>لا توجد ردود بعد.</p>
      <p class="err" id="err2" role="alert"></p>
    </div>
  </section>

</div>

<!-- one level up: this page lives in /list/, config.js sits at the root
     so the invitation and the list share exactly one copy of it -->
<script src="../config.js?v=3"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   The couple's list. Opened by a link and nothing else — no account, no
   password, no form.

   The secret rides in the URL fragment (/list/#s=...) rather than
   the query string on purpose: a fragment is never sent to the server,
   so it stays out of access logs, out of the Referer header on any link
   clicked from here, and out of anything a proxy records.

   Understand the trade: whoever holds the link can read the list. That
   is what "a link that just works" means. It is one long random string
   and it is not written down anywhere in this repo — and if it ever gets
   out, re-run the function in sql/setup.sql with a new value and every
   old link dies at once.

   No framework and no Supabase SDK: one REST call is the whole thing,
   and a page with no build step still works in two years.
   ══════════════════════════════════════════════════════════════════ */
const DB = window.INVITE_DB || {};
const $ = (s) => document.querySelector(s);

const ar = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

const gate = $('#gate'), list = $('#list'), msg = $('#msg'), err2 = $('#err2');

/* Left in the address bar on purpose: clearing it would mean a refresh
   loses the link. It is a bookmark as much as a credential. */
const secret = new URLSearchParams(location.hash.slice(1)).get('s') || '';

function fail(text) {
  gate.hidden = false; list.hidden = true;
  msg.textContent = text; msg.classList.add('bad');
}

let rows = [];

/* Every call is the same shape: a function name, the secret, and
   whatever else it needs. One place to get the headers right. */
function rpc(fn, body) {
  return fetch(`${DB.url.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    /* The old anon key is a JWT and PostgREST reads the role out of it,
       so it goes in Authorization too. The new sb_publishable_ key is not
       a JWT — handing it to Authorization gives PostgREST something it
       cannot parse and the call comes back 401. Both go in apikey; only
       the JWT gets a Bearer. */
    headers: Object.assign(
      { apikey: DB.key, 'Content-Type': 'application/json' },
      /^eyJ/.test(DB.key) ? { Authorization: `Bearer ${DB.key}` } : {},
    ),
    body: JSON.stringify(Object.assign({ pass: secret }, body || {})),
  });
}

async function load() {
  err2.textContent = '';
  try {
    const r = await rpc('guest_list');
    if (!r.ok) {
      /* A rejected secret is the function raising, and PostgREST returns
         a raise as 500 — the same status a database that is genuinely
         down would give. So the status alone cannot tell the two apart;
         the body can. Anything carrying the function's own error is a
         bad link, everything else is a bad moment. */
      let raised = false;
      try { raised = (await r.json()).code === 'P0002'; } catch {}
      fail(raised
        ? 'هذا الرابط غير صالح.'
        : 'تعذّر الوصول إلى القائمة. حاول بعد قليل.');
      return;
    }
    rows = await r.json();
    gate.hidden = true; list.hidden = false;
    paint();
  } catch {
    if (list.hidden) fail('تعذّر الوصول إلى القائمة. تحقّق من الاتصال.');
    else err2.textContent = 'تعذّر التحديث. حاول مرة أخرى.';
  }
}

$('#refresh').addEventListener('click', load);

/* a reply counts as attendance when it starts with نعم — the same test
   the invitation makes when it decides to ask for a headcount */
const coming = (r) => (r.attending || '').startsWith('نعم');

function paint() {
  const yes = rows.filter(coming);
  const heads = yes.reduce((s, r) => s + (r.guests || 0), 0);
  $('#tYes').textContent   = ar(yes.length);
  $('#tHeads').textContent = ar(heads);
  $('#tNo').textContent    = ar(rows.length - yes.length);
  $('#tAll').textContent   = ar(rows.length);

  const body = $('#rows');
  body.textContent = '';
  $('#empty').hidden = rows.length > 0;

  for (const r of rows) {
    const card = document.createElement('div');
    card.className = 'g';

    const name = document.createElement('div');
    name.className = 'g-name';
    name.textContent = r.name || '—';        // textContent, never innerHTML:
    card.appendChild(name);                  // guests type these fields

    card.appendChild(removeCell(r));

    /* One text run, not three spans with margins between them. Split
       across elements the bidi algorithm reordered the separator against
       the numeral and it came out as «نعم٣٠ أشخاص» — the dot reading as
       a zero stuck to the count. Written as a single string it is laid
       out once, in order. */
    const meta = document.createElement('div');
    meta.className = 'g-meta ' + (coming(r) ? 'yes' : 'no');
    const n = r.guests || 0;
    meta.textContent = coming(r)
      ? `نعم، ${ar(n)} ${n === 1 ? 'شخص' : n === 2 ? 'شخصان' : 'أشخاص'}`
      : 'اعتذار';
    card.appendChild(meta);

    if (r.note) {
      const note = document.createElement('div');
      note.className = 'g-note';
      note.textContent = r.note;
      card.appendChild(note);
    }

    const w = document.createElement('div');
    w.className = 'g-when';
    w.textContent = when(r.created_at);
    card.appendChild(w);

    body.appendChild(card);
  }
}

/* Two taps to delete, and the second one only appears after the first.
   A bare × next to a name is a row lost to a thumb brushing the screen,
   and nothing behind it can put the row back. */
function removeCell(r) {
  const td = document.createElement('div');
  td.className = 'g-act';

  const ask = document.createElement('button');
  ask.type = 'button'; ask.className = 'x'; ask.textContent = '✕';
  ask.setAttribute('aria-label', `حذف ${r.name || ''}`);

  ask.addEventListener('click', () => {
    td.textContent = '';
    const box = document.createElement('div');
    box.className = 'confirm';

    const q = document.createElement('b'); q.textContent = 'حذف؟';
    const yes = document.createElement('button');
    yes.type = 'button'; yes.className = 'yes'; yes.textContent = 'نعم';
    const no = document.createElement('button');
    no.type = 'button'; no.className = 'no'; no.textContent = 'لا';

    no.addEventListener('click', () => { td.textContent = ''; td.appendChild(ask); });
    yes.addEventListener('click', async () => {
      yes.disabled = no.disabled = true;
      try {
        const res = await rpc('guest_remove', { p_id: r.id });
        if (!res.ok) throw new Error(res.status);
        await load();
      } catch {
        err2.textContent = 'تعذّر الحذف. حاول مرة أخرى.';
        td.textContent = ''; td.appendChild(ask);
      }
    });

    box.append(q, yes, no);
    td.appendChild(box);
  });

  td.appendChild(ask);
  return td;
}

function when(iso) {
  if (!iso) return '';
  try {
    return new Intl.DateTimeFormat('ar-JO', {
      dateStyle: 'short', timeStyle: 'short', timeZone: 'Asia/Amman',
    }).format(new Date(iso));
  } catch { return iso.slice(0, 16).replace('T', ' '); }
}

/* ── CSV ─────────────────────────────────────────────────────────── */
$('#csv').addEventListener('click', () => {
  const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [['الاسم', 'الحضور', 'العدد', 'ملاحظات', 'وصل في'].map(esc).join(',')];
  for (const r of rows) {
    lines.push([r.name, coming(r) ? 'نعم' : 'اعتذار',
                coming(r) ? (r.guests || 0) : '', r.note || '',
                when(r.created_at)].map(esc).join(','));
  }
  /* the BOM is what makes Excel open Arabic as Arabic instead of mojibake */
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rsvp.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ── add a guest ─────────────────────────────────────────────────── */
const addForm = $('#addForm'), addOpen = $('#addOpen'), aErr = $('#aErr');

const showAdd = (on) => {
  addForm.hidden = !on;
  addOpen.hidden = on;
  if (on) { aErr.textContent = ''; $('#aName').focus(); }
};
addOpen.addEventListener('click', () => showAdd(true));
$('#aCancel').addEventListener('click', () => { clearAdd(); showAdd(false); });

/* the headcount lives here, not in a field, so nothing a keyboard does
   can put a value in it that the database would refuse */
let aCount = 1;
const MAX = 10;

function setCount(n) {
  aCount = Math.min(MAX, Math.max(1, n));
  $('#aOut').textContent = ar(aCount);
  $('#aMinus').disabled = aCount === 1;
  $('#aPlus').disabled  = aCount === MAX;
}
$('#aMinus').addEventListener('click', () => setCount(aCount - 1));
$('#aPlus') .addEventListener('click', () => setCount(aCount + 1));

function clearAdd() {
  $('#aName').value = ''; $('#aNote').value = '';
  $('#aGo').value = 'yes';
  setCount(1);
  goneChanged();
}

/* the same two strings the invitation writes, so a hand-added guest and
   a self-replied one are the same kind of row and coming() reads both */
const YES = 'نعم، بكل سرور';
const NO  = 'للأسف لن أتمكن من الحضور';

$('#aSave').addEventListener('click', async () => {
  const name = $('#aName').value.trim();
  if (!name) { aErr.textContent = 'يرجى كتابة الاسم.'; $('#aName').focus(); return; }

  const going = $('#aGo').value === 'yes';
  const n = aCount;

  const btn = $('#aSave');
  btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
  aErr.textContent = '';
  try {
    const res = await rpc('guest_add', {
      p_name: name,
      p_attending: going ? YES : NO,
      p_guests: going ? n : 0,
      p_note: $('#aNote').value.trim() || null,
    });
    if (!res.ok) throw new Error(res.status);
    clearAdd(); showAdd(false);
    await load();
  } catch {
    aErr.textContent = 'تعذّر الحفظ. حاول مرة أخرى.';
  } finally {
    btn.disabled = false; btn.textContent = 'حفظ';
  }
});

/* the headcount only means something for someone who is coming */
function goneChanged() {
  const going = $('#aGo').value === 'yes';
  $('#aOut').closest('.step').classList.toggle('off', !going);
}
$('#aGo').addEventListener('change', goneChanged);
setCount(1);

/* ── go ──────────────────────────────────────────────────────────── */
if (!DB.url || !DB.key) {
  fail('config.js لم يُملأ بعد — أضف رابط المشروع والمفتاح العام.');
} else if (!secret) {
  fail('افتح القائمة من الرابط الكامل الذي يحتوي على المفتاح.');
} else {
  load();
}
</script>
</body>
</html>
